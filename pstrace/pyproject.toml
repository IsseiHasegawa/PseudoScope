[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pstrace"
version = "0.1.0"
description = "Per-test native function tracing via -finstrument-functions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pytest>=7"]

[project.scripts]
pstrace-report = "pstrace.report:main"

[tool.setuptools]
packages = ["pstrace"]
