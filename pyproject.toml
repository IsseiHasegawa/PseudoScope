[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudoscope"
version = "0.2.0"
description = "Detect pseudo-tested C/C++ code via default-return mutations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.24.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
]

[project.scripts]
pseudoscope = "pseudoscope.cli:main"

[tool.setuptools.packages.find]
include = ["pseudoscope*"]
